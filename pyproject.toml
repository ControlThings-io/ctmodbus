[project]
name = "ctmodbus"
version = "1.0.0rc1"
description = "A highly flexible Modbus tool made for penetration testers"
authors = [{ name = "Justin Searle", email = "justin@controlthings.io" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["Modbus", "test", "ICS", "control", "ControlThings"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ctui==1.0.0rc1",
    "pyserial>=3.5,<4",
    "pymodbus[serial]>=3.15.0,<3.16",
    "tabulate>=0.8.9,<0.9",
    "psutil>=7,<8",
]

[project.urls]
Homepage = "https://www.controlthings.io"
Repository = "https://github.com/ControlThings-io/ctmodbus"

[project.scripts]
ctmodbus = "ctmodbus.commands:main"

[dependency-groups]
dev = ["pylint", "black", "isort"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.black]
target-version = ["py311"]

[tool.pylint.messages_control]
# Typed CLI parameters and explicit settings naturally exceed these heuristics.
disable = ["too-many-arguments", "too-many-positional-arguments", "too-many-instance-attributes", "too-many-locals", "unidiomatic-typecheck"]

[tool.pylint.format]
max-line-length = "88"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
